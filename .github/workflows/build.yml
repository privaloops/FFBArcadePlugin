name: Build

on:
  push:
    branches: [master, fix/*, feature/*]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Release]
        platform: [x86, x64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore Dinput8Wrapper.sln

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Post-Build dependencies
        run: |
          cd Post-Build
          npm install

      - name: Build
        run: msbuild Dinput8Wrapper.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /m

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FFBArcadePlugin-${{ matrix.configuration }}-${{ matrix.platform }}
          path: |
            ${{ matrix.configuration }}.${{ matrix.platform == 'x86' && 'Win32' || matrix.platform }}/*.dll
            ${{ matrix.configuration }}.${{ matrix.platform == 'x86' && 'Win32' || matrix.platform }}/*.ini
